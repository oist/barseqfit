name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      # Plain `pytest` uses testpaths, so README and docstring doctests run too.
      - name: Run tests
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12') }}
        run: uv run pytest
      # Coverage is measured on one cell only. There is no failing threshold.
      # TODO (maintainer): publish a coverage badge, either with Codecov
      # (needs an account and a CODECOV_TOKEN secret) or with a badge file
      # committed to the repository from this job's summary figure.
      - name: Run tests with coverage
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        run: uv run pytest --cov=barseqfit --cov-report=xml --cov-report=term
      - name: Coverage summary
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        run: |
          total=$(uv run python -c "import xml.etree.ElementTree as ET; print(round(float(ET.parse('coverage.xml').getroot().get('line-rate')) * 100, 1))")
          echo "Total line coverage: ${total}%" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  r:
    name: R 4.1.3 testthat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.1.3"
      - uses: r-lib/actions/setup-renv@v2
        with:
          working-directory: r
      - name: Run testthat
        working-directory: r
        run: Rscript -e 'testthat::test_dir("tests/testthat", load_package = "source", stop_on_failure = TRUE)'
